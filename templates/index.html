<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Publisher - Send to Printer Queue</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Send to Printer Queue</h1>
      <div class="form-row">
        <input id="messageInput" type="text" placeholder="Enter message to print" />
      </div>

      <div class="form-row">
        <button id="startBtn">Start Continuous</button>
        <button id="stopBtn" disabled>Stop</button>
      </div>

      <div id="stats" class="status">
        <div>Sent: <span id="sentCount">0</span></div>
        <div id="status">Ready</div>
      </div>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
